  <body data-page="recipesPage" class="bg-[#faf9f6] font-['Be_Vietnam_Pro'] text-[15px] leading-[1.65] text-[#2f342d]">
     <header
      class="sticky top-0 z-10 flex h-[76px] items-center border-b border-[#eceae4] bg-[#faf9f6]/92 backdrop-blur-[12px] md:h-[105px]"
    >
      <div
        class="js-nav relative mx-auto flex w-full items-center justify-between px-[18px] md:px-[72px]"
      >
        <a
          class="inline-flex min-w-0 items-center gap-2 font-['Playfair_Display'] text-[16px] font-bold leading-none md:gap-2.5 md:text-[36px]"
          href="index.html"
          aria-label="Nhà bếp của Lyn - Trang chủ"
          ><img
            class="h-9 w-9 shrink-0 md:h-11 md:w-11"
            src="assets/images/logo-lyn-kitchen.svg"
            alt=""
          /><span class="whitespace-nowrap">Nhà bếp <span class="text-[#78966c]">của Lyn</span></span></a
        >
        <nav
          class="js-nav-links fixed top-[68px] left-0 right-0 z-20 hidden flex max-h-[calc(100vh-68px)] flex-col gap-1 border-b border-[#e7e5df] bg-[#faf9f6] px-5 py-5 text-[15px] font-semibold shadow-[0_8px_24px_rgba(47,52,45,.12)] md:static md:flex md:max-h-none md:flex-row md:gap-[40px] md:border-0 md:bg-transparent md:px-0 md:py-0 md:text-[17px] md:shadow-none"
        >
          <a class="rounded-lg px-3 py-2 hover:bg-[#78966c]/10 md:rounded-none md:px-0 md:py-0 md:hover:bg-transparent" href="index.html">Trang chủ</a
          ><a class="rounded-lg px-3 py-2 text-[#78966c] hover:bg-[#78966c]/10 md:rounded-none md:px-0 md:py-0 md:hover:bg-transparent" href="recipes.html">Công thức</a
          ><a class="rounded-lg px-3 py-2 hover:bg-[#78966c]/10 md:rounded-none md:px-0 md:py-0 md:hover:bg-transparent" href="meal-prep.html">Meal prep</a
          ><a class="rounded-lg px-3 py-2 hover:bg-[#78966c]/10 md:rounded-none md:px-0 md:py-0 md:hover:bg-transparent" href="articles.html">Góc sống khỏe</a
          ><a class="rounded-lg px-3 py-2 hover:bg-[#78966c]/10 md:rounded-none md:px-0 md:py-0 md:hover:bg-transparent" href="about.html">Về chúng mình</a>
        </nav>
        <button class="js-menu shrink-0 rounded-md p-2 text-[22px] leading-none transition hover:bg-[#78966c]/10 md:hidden" type="button" aria-label="Mở menu" aria-expanded="false">☰</button>
      </div>
    </header>
    <main class="mx-auto max-w-[1180px] px-[18px] md:px-[26px]">
      <section class="py-[48px] pb-[30px] text-center md:py-[74px] md:pb-[50px]">
        <p class="eyebrow">🥗 Công thức healthy</p>
        <h1 class="font-['Playfair_Display'] text-[clamp(42px,6vw,76px)] leading-[1.12] mt-4">Dễ làm, <span class="text-highlight">đủ đầy</span>, ngon lành</h1>
        <p class="mx-auto my-[15px] max-w-[600px] text-[#74776f]">Những công thức vừa vặn với nhịp sống bận rộn của bạn.</p>
      </section>
      <div class="mb-8 flex flex-wrap items-center gap-3">
        <input id="search" type="search" class="min-w-[220px] flex-1 rounded-xl border border-[#e7e5df] bg-white px-[15px] py-3 shadow-sm" placeholder="Tìm tên món ăn..." /><select
          id="category"
          class="rounded-xl border border-[#e7e5df] bg-white p-3 shadow-sm"
        >
          <option value="all">Tất cả bữa ăn</option>
          <option>Bữa sáng</option>
          <option>Bữa trưa</option>
          <option>Bữa tối</option>
          <option>Ăn nhẹ</option></select
        ><select id="sort" class="rounded-xl border border-[#e7e5df] bg-white p-3 shadow-sm">
          <option value="default">Sắp xếp mặc định</option>
          <option value="time">Thời gian nhanh nhất</option>
          <option value="calories">Ít calories nhất</option></select
        ><span id="result-count" class="ml-auto text-[13px] text-[#74776f]"></span>
      </div>
      <div id="recipe-list" class="grid gap-[22px] md:grid-cols-3"></div>
    </main>
    <footer class="mt-[70px] border-t border-[#e7e5df] py-[42px] text-[13px] text-[#74776f]">
      <div
        class="mx-auto flex max-w-[1180px] flex-col gap-5 px-[18px] md:flex-row md:justify-between md:px-[26px]"
      >
        <span
          class="inline-flex items-center gap-2.5 font-['Playfair_Display'] text-[24px] font-bold leading-none text-[#2f342d]"
          ><img class="h-10 w-10" src="assets/images/logo-lyn-kitchen.svg" alt="" /><span
            >Nhà bếp <span class="text-[#78966c]">của Lyn</span></span
          ></span
        ><span>© 2026 · Ăn uống lành mạnh theo cách của bạn.</span>
      </div>
    </footer>
    <script type="module" src="js/main.js"></script>
  </body>
